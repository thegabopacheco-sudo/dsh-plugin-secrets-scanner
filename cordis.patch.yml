# dsh-plugin-secrets-scanner — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "secrets".
# Tools resultantes: mcp__secrets__* (ver README).
- insert:
    - id: mcp-secrets-scanner
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: secrets
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/secrets-scanner/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
